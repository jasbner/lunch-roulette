<title>Lunch Roulette</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one narrow column; a big order-ticket result up top, house rules and the menu of places below. */
:root {
  --bg: #F2F5F1;
  --surface: #FFFFFF;
  --fg: #17231F;
  --muted: #5B6B65;
  --line: #D6DED9;
  --accent: #F2B705;       /* mustard: button fill */
  --accent-ink: #1E1A05;
  --teal: #0E6B5A;         /* links, chips */
  --chip: #E1EEE9;
  --warn: #A3401F;
  --display: "Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111916; --surface: #18231F; --fg: #E8EFEB; --muted: #9AABA4; --line: #2C3B35;
    --accent: #F2B705; --accent-ink: #1E1A05; --teal: #5CC9B1; --chip: #1F3530; --warn: #F08A66;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111916; --surface: #18231F; --fg: #E8EFEB; --muted: #9AABA4; --line: #2C3B35;
  --accent: #F2B705; --accent-ink: #1E1A05; --teal: #5CC9B1; --chip: #1F3530; --warn: #F08A66;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font: 400 16px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
main { max-width: 560px; margin: 0 auto; display: grid; gap: 28px; }
header h1 { font: 800 clamp(34px, 9vw, 48px)/1 var(--display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
header p { margin: 8px 0 0; color: var(--muted); }

.ticket {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 22px 22px 20px; display: grid; gap: 14px; position: relative;
}
.ticket::after { /* perforated tear line */
  content: ""; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 0;
  border-bottom: 2px dashed var(--line);
}
.label { font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.pick-name { font: 800 clamp(28px, 7.5vw, 40px)/1.05 var(--display); margin: 0; text-wrap: balance; min-height: 1.05em; }
.pick-name.spinning { color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--chip); color: var(--fg); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
.dish { color: var(--muted); margin: 0; }
.dish b { color: var(--fg); font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
button, .btn {
  font: 600 16px/1 var(--body); border-radius: 10px; padding: 14px 18px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-decoration: none;
  display: inline-flex; align-items: center; gap: 8px;
}
button:focus-visible, .btn:focus-visible, input:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-size: 18px; flex: 1 1 100%; justify-content: center; padding: 18px; }
.primary:active { transform: translateY(1px); }
.btn.dd { color: var(--teal); border-color: var(--teal); }
.ok { color: var(--muted); font-size: 14px; margin: 0; min-height: 1.4em; }

section h2 { font: 800 20px/1.2 var(--display); margin: 0 0 10px; }
.rules { display: grid; gap: 10px; }
.rule { display: flex; gap: 10px; align-items: flex-start; }
.rule input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--teal); flex: none; }
.rule label { cursor: pointer; }
.rule small { display: block; color: var(--muted); }

.list-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.list-tools button { padding: 8px 14px; font-size: 14px; }
.list-tools .count { margin-left: auto; color: var(--muted); font: 500 13px var(--mono); }
.places { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.places li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.places input { width: 20px; height: 20px; accent-color: var(--teal); flex: none; margin: 0; }
.places label { flex: 1; min-width: 0; cursor: pointer; }
.places .nm { font-weight: 600; }
.places .sub { color: var(--muted); font-size: 13px; }
.places .ff { color: var(--warn); font-size: 12px; font-weight: 600; margin-left: 6px; }
.places .num { font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.places li.off .nm { text-decoration: line-through; color: var(--muted); }
.places li.far { opacity: .45; }
.rule select { margin-left: auto; flex: none; font: 500 15px var(--body); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.rule select:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

footer { color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<main>
  <header>
    <h1>Lunch Roulette</h1>
    <p>Nobody has to decide. Tap the button, order what it says.</p>
  </header>

  <div class="ticket" aria-live="polite">
    <span class="label" id="ticket-label">Today's lunch</span>
    <p class="pick-name" id="pick-name">Tap “Pick lunch”</p>
    <div class="meta" id="pick-meta"></div>
    <p class="dish" id="pick-dish"></p>
    <div class="actions">
      <button class="primary" id="pick-btn" type="button">Pick lunch</button>
      <a class="btn dd" id="dd-link" href="https://www.doordash.com/" target="_blank" rel="noopener" hidden>Open in DoorDash ↗</a>
    </div>
    <p class="ok" id="status"></p>
  </div>

  <section>
    <h2>House rules</h2>
    <div class="rules">
      <div class="rule">
        <input type="checkbox" id="r-fast" checked>
        <label for="r-fast">Skip fast food<small>Chains like McDonald's, Chipotle, Subway, Raising Cane's</small></label>
      </div>
      <div class="rule">
        <label for="r-dist">Max distance<small>Farther out means a longer wait</small></label>
        <select id="r-dist">
          <option value="1">1 mi</option>
          <option value="2">2 mi</option>
          <option value="3">3 mi</option>
          <option value="0">Any distance</option>
        </select>
      </div>
    </div>
  </section>

  <section>
    <h2>The list</h2>
    <div class="list-tools">
      <button type="button" id="clear-all">Clear all</button>
      <button type="button" id="select-all">Select all</button>
      <span class="count" id="on-count"></span>
    </div>
    <ul class="places" id="places"></ul>
  </section>

  <footer>97 places from DoorDash within 5 mi of the office, sorted by distance. Ratings as of Nov 4, 2026. Uncheck any place the boss won’t eat.</footer>
</main>

function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

// Per-place on/off choices; places marked `off` (e.g. the bakery) start unchecked.
const overrides = load("lr-on", Object.fromEntries(load("lr-disabled", []).map(id => [id, false])));
const isOn = p => p.id in overrides ? overrides[p.id] : !p.off;
const rules = Object.assign({ fast: true, maxMi: 0 }, load("lr-rules", {})); // maxMi 0 = any distance
let current = null;

const $ = id => document.getElementById(id);

function renderPlaces() {
  const ul = $("places"); ul.innerHTML = "";
  for (const p of [...PLACES].sort((a, b) => a.mi - b.mi)) {
    const li = document.createElement("li");
    if (!isOn(p)) li.classList.add("off");
    if (rules.maxMi && p.mi > rules.maxMi) li.classList.add("far");
    li.innerHTML = `<input type="checkbox" id="p-${p.id}" ${isOn(p) ? "checked" : ""}>
      <label for="p-${p.id}"><span class="nm"></span>${p.fast ? '<span class="ff">FAST FOOD</span>' : ""}<br><span class="sub"></span></label>
      <span class="num">★${p.rating.toFixed(1)} · ${p.mi} mi</span>`;
    li.querySelector(".nm").textContent = p.name;
    li.querySelector(".sub").textContent = p.cuisine;
    li.querySelector("input").addEventListener("change", e => {
      overrides[p.id] = e.target.checked;
      save("lr-on", overrides); renderPlaces();
    });
    ul.appendChild(li);
  }
  $("on-count").textContent = `${PLACES.filter(isOn).length} of ${PLACES.length} checked`;
}

function setAll(on) {
  for (const p of PLACES) overrides[p.id] = on;
  save("lr-on", overrides); renderPlaces();
}

const today = () => new Date().toLocaleDateString("en-CA");

function candidates() {
  return PLACES.filter(p => isOn(p) && !(rules.fast && p.fast) && (!rules.maxMi || p.mi <= rules.maxMi) && p !== current);
}

function show(p) {
  $("pick-name").textContent = p.name;
  const meta = $("pick-meta"); meta.innerHTML = "";
  for (const t of [p.cuisine, `★ ${p.rating.toFixed(1)} (${p.reviews})`, `${p.mi} mi`]) {
    const s = document.createElement("span"); s.className = "chip"; s.textContent = t; meta.appendChild(s);
  }
  if (!p.dish) { $("pick-dish").textContent = ""; return; }
  $("pick-dish").innerHTML = `Most liked: <b></b>`;
  $("pick-dish").querySelector("b").textContent = p.dish + (p.price ? " · " + p.price : "");
}

function present(p) {
  current = p; show(p);
  $("dd-link").href = `https://www.doordash.com/store/${p.store}`;
  $("dd-link").hidden = false;
  $("pick-btn").textContent = "Pick again";
}

function pick() {
  const pool = candidates();
  if (!pool.length) { $("status").textContent = "Every place is unchecked or filtered out. Check a few places in the list below."; return; }
  const winner = pool[Math.floor(Math.random() * pool.length)];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const btn = $("pick-btn"); btn.disabled = true;
  $("dd-link").hidden = true; $("status").textContent = "";
  const finish = () => {
    present(winner);
    $("pick-name").classList.remove("spinning");
    btn.disabled = false;
    $("status").textContent = `Picked from ${pool.length} place${pool.length === 1 ? "" : "s"} that fit the rules.`;
    save("lr-current", { id: winner.id, date: today() });
  };
  if (reduce) return finish();
  const names = pool.map(p => p.name);
  $("pick-name").classList.add("spinning");
  let i = 0, delay = 50;
  (function tick() {
    $("pick-name").textContent = names[Math.floor(Math.random() * names.length)];
    if (++i > 14) return finish();
    delay *= 1.15; setTimeout(tick, delay);
  })();
}

$("pick-btn").addEventListener("click", pick);
$("clear-all").addEventListener("click", () => setAll(false));
$("select-all").addEventListener("click", () => setAll(true));
$("r-fast").checked = rules.fast;
$("r-fast").addEventListener("change", e => { rules.fast = e.target.checked; save("lr-rules", rules); });
if (![...$("r-dist").options].some(o => o.value === String(rules.maxMi))) rules.maxMi = 0;
$("r-dist").value = String(rules.maxMi);
$("r-dist").addEventListener("change", e => { rules.maxMi = Number(e.target.value); save("lr-rules", rules); renderPlaces(); });

renderPlaces();
// Bring back today's pick if the page reloads (the Android app restarts on a theme change or after being closed in the background).
const saved = load("lr-current", null);
const savedPlace = saved && saved.date === today() && PLACES.find(p => p.id === saved.id);
if (savedPlace) present(savedPlace);
</script>
